name: Update Curriculum

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser groq requests numpy
          pip install sentence-transformers --quiet

      - name: Run processing script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python process.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Bramble Bot"
          git config --global user.email "bot@bramble.app"
          git add curriculum.json article_cache.json
          git diff --staged --quiet || git commit -m "chore: daily curriculum update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
